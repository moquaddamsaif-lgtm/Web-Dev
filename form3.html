<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Form</title>
</head>
<body>
  <header>
    <h2 align="center">My Shop</h2>
    <p align="center">Welcome to my shop</p>
  </header>

  <nav>
   <h3>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Cart</a>
    <a href="#">Contact</a>
   </h3>
  </nav>
  <hr>

  <section>
    <article>
      <form action="mailto:moquaddamsaif@gmail.com">
        <h2>Order Form</h2>

        <fieldset style="width:600px;">
          <legend align="right">Billing Address</legend>
          <label for="Name">Name:</label>
          <input type="text" id="Name" name="Name"><br><br>

          <label for="Street">Street:</label>
          <textarea id="Street" rows="3" cols="40"></textarea><br><br>

          <label for="City">City:</label>
          <input type="text" id="City" name="City"><br><br>

          <label for="State">State:</label>
          <input type="text" id="State" name="State">
          <label for="Zip">Zip:</label>
          <input type="text" id="Zip" name="Zip"><br><br>

          <label for="Country">Country:</label>
          <input type="text" id="Country" name="Country" value="United States"><br><br>
        </fieldset>

        <br>
        <input type="checkbox" id="check" name="check">
        <label for="check">Ship to Billing Address</label>
        <br><br>

        <fieldset style="width:600px;">
          <legend align="right">Shipping Address</legend>
          <label for="ShipName">Name:</label>
          <input type="text" id="ShipName" name="ShipName"><br><br>

          <label for="ShipStreet">Street:</label>
          <textarea id="ShipStreet" rows="3" cols="40"></textarea><br><br>

          <label for="ShipCity">City:</label>
          <input type="text" id="ShipCity" name="ShipCity"><br><br>

          <label for="ShipState">State:</label>
          <input type="text" id="ShipState" name="ShipState">
          <label for="ShipZip">Zip:</label>
          <input type="text" id="ShipZip" name="ShipZip"><br><br>

          <label for="ShipCountry">Country:</label>
          <input type="text" id="ShipCountry" name="ShipCountry" value="United States"><br><br>
        </fieldset>

        <br>

        <fieldset style="width:600px;">
          <legend align="right">Payment Information</legend>
          <label>Credit Card:</label><br>
          <label><input type="radio" name="card" value="American Express"> American Express</label><br>
          <label><input type="radio" name="card" value="Discover"> Discover</label><br>
          <label><input type="radio" name="card" value="MasterCard"> MasterCard</label><br>
          <label><input type="radio" name="card" value="Visa"> Visa</label><br><br>

          <label for="CardName">Name on Card:</label>
          <input type="text" id="CardName" name="CardName"><br><br>

          <label for="CardNumber">Card Number:</label>
          <input type="password" id="CardNumber" name="CardNumber"><br><br>

          <label for="Month">Expiration Date:</label>
          <select id="Month" name="Month">
            <option>01</option><option>02</option><option>03</option><option>04</option>
          </select>
          <select id="Year" name="Year">
            <option>2001</option><option>2002</option><option>2003</option><option>2004</option>
          </select>
        </fieldset>
        <br>
        <input type="button" value="Return to Shopping Cart">
        <input type="submit" value="Submit Order">
        <input type="reset" value="Reset Order">
      </form>
    </article>

    <aside>
      <h3>Helpful Tips</h3>
      <ul>
        <li>Double‑check your address</li>
        <li>Use a valid card number</li>
        <li>Keep a copy of your order</li>
      </ul>
    </aside>
  </section>

  <footer>
    <p align="center">&copy; 2026 My Shop. All rights reserved.</p>
  </footer>
</body>
</html>
