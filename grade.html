<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Example</title>
</head>
<body>
    <script>
    
        let grade = Number(console.log("Enter your grade (number):"));
        

      
    

        if (grade > 90) {
            document.write("Your grade is A");
        } else if (grade > 80) {
            document.write("Your grade is B");
        } else if (grade > 70) {
            document.write("Your grade is C");
        } else if (grade > 60) {
            document.write("Your grade is D");
        } else {
            document.write("Your grade is F");
        }
    </script>
</body>
</html>
