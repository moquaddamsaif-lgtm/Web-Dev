<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Switch Case</title>
</head>
<body>
    <script>
        let weekdays =prompt("Enter any day").toLowerCase(); 

        switch(weekdays) {
            case "monday":
                document.write("Start strong");
                break;
            case "tuesday":
                document.write("Keep moving");
                break;
            case "wednesday":
                document.write("Halfway there");
                break;
            case "thursday":
                document.write("Stay focused");
                break;
            case "friday":
                document.write("Finish with energy");
                break;
            case "saturday":
                document.write("Relax and recharge");
                break;
            case "sunday":
                document.write("Family and fun");
                break;
            default:
                document.write("Not a valid day");
        }
    </script>
</body>
</html>
