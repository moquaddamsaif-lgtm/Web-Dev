<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Example</title>
</head>
<body>
  <form action="collect.html">
     <fieldset>
    <legend>personal details</legend>
     <label for="name">Name</label>
    <input type="text" id="name" name="name">
    <br><br>

    <label for="father">Father Name</label>
    <input type="text" id="father" name="father" placeholder="Enter your Father Name">
    <br><br>

    <label for="dob">DOB</label>
    <input type="date" id="dob" name="dob">
    <br><br>

    <label for="email">Email</label>
    <input type="email" id="email" name="email">
    <br><br>

    <label>Gender:</label>
    <input type="radio" id="male" name="gender" value="Male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="Female">
    <label for="female">Female</label>
    <br><br>

    <label>Course:</label>
    <input type="checkbox" id="java" name="course" value="Java">
    <label for="java">Java</label>
    <input type="checkbox" id="c" name="course" value="C">
    <label for="c">C</label>
    <br><br>

    <label for="subject">Subject</label>
    <select id="subject" name="subject">
      <option value="HTML">HTML</option>
      <option value="C">C</option>
      <option value="C++">C++</option>
    </select>
    <br><br>

    <label for="feedback">Feedback</label>
    <textarea id="feedback" name="feedback" rows="7" cols="40" placeholder="Write your feedback here"></textarea>
    <br><br>

    <label for="browser">Choose a browser</label>
    <input type="text" list="browser" id="browser" name="browser">
    <datalist id="browser">
      <option value="Chrome">
      <option value="Firefox">
      <option value="Brave">
      <option value="Safari">
    </datalist>
    <br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

  </fieldset>
   
  </form>
 
</body>
</html>
