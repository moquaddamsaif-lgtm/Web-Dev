<!DOCTYPE html>
<html>
<head>
  <title>Input Types Example</title>
</head>
<body>
  <form>
    
    <label for="favcolor">Choose a color:</label>
    <input type="color" id="favcolor" name="favcolor"><br><br>

   
    <label for="birthday">Select a date:</label>
    <input type="date" id="birthday" name="birthday"><br><br>

   
    <label for="dt">Datetime:</label>
    <input type="datetime" id="dt" name="dt"><br><br>

  
    <label for="dtlocal">Datetime Local:</label>
    <input type="datetime-local" id="dtlocal" name="dtlocal"><br><br>


    <label for="email">Email:</label>
    <input type="email" id="email" name="email"><br><br>

  
    <label for="volume">Range (0–100):</label>
    <input type="range" id="volume" name="volume" min="0" max="100"><br><br>

   
    <label for="search">Search:</label>
    <input type="search" id="search" name="search"><br><br>


    <label for="phone">Telephone:</label>
    <input type="tel" id="phone" name="phone"><br><br>


    <label for="appt">Select a time:</label>
    <input type="time" id="appt" name="appt"><br><br>

   
    <label for="homepage">Website URL:</label>
    <input type="url" id="homepage" name="homepage"><br><br>

   
    <label for="week">Select a week:</label>
    <input type="week" id="week" name="week"><br><br>

    <input type="submit" value="Submit">
  </form>
</body>
</html>
